name: Existing MACD 5m Indicator Overlays Stage 2

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/existing-strategy-indicator-overlays.yml"
      - "scripts/research_existing_strategy_indicator_overlays.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macd-5m-overlay-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified MACD-universe 5m public history
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from core.binance_public_ohlcv_archive import download_range_to_csv

          symbols = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "SUIUSDT", "1000PEPEUSDT")
          root = Path("data/existing_strategy_overlay_history")
          for symbol in symbols:
              result = download_range_to_csv(
                  symbol=symbol,
                  interval="5m",
                  start=date(2025, 8, 1),
                  end=date(2026, 7, 31),
                  output_path=root / symbol / f"{symbol}_5m.csv",
              )
              print(symbol, result["row_count"], result["archive_count"])
          PY

      - name: Run unchanged MACD 5m with frozen overlays
        run: python scripts/research_existing_strategy_indicator_overlays.py

      - name: Upload compact Stage-2 result
        uses: actions/upload-artifact@v4
        with:
          name: existing-macd-5m-indicator-overlays-stage2
          path: research_results/existing_macd_5m_indicator_overlays_stage2.json
          if-no-files-found: error
          retention-days: 7
