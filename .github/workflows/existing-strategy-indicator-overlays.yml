name: Weak Short Existing Baseline Older Holdout

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/existing-strategy-indicator-overlays.yml"
      - "scripts/research_existing_strategy_indicator_overlays.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weak-short-older-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified untouched weak-short public history
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from core.binance_public_ohlcv_archive import download_range_to_csv

          symbols = ("XRPUSDT", "ARBUSDT", "DOGEUSDT")
          timeframes = ("15m", "1h")
          root = Path("data/existing_strategy_overlay_history")
          for symbol in symbols:
              for timeframe in timeframes:
                  result = download_range_to_csv(
                      symbol=symbol,
                      interval=timeframe,
                      start=date(2024, 8, 1),
                      end=date(2025, 7, 31),
                      output_path=root / symbol / f"{symbol}_{timeframe}.csv",
                  )
                  print(symbol, timeframe, result["row_count"], result["archive_count"])
          PY

      - name: Run unchanged weak-short baseline holdout
        run: python scripts/research_existing_strategy_indicator_overlays.py

      - name: Upload compact holdout result
        uses: actions/upload-artifact@v4
        with:
          name: weak-short-existing-baseline-older-holdout
          path: research_results/weak_short_existing_baseline_older_holdout.json
          if-no-files-found: error
          retention-days: 7
