name: Indicator Composite BNB-SUI Holdout

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/indicator-composite-btc-baseline.yml"
      - "scripts/research_indicator_composite_multisymbol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bnb-sui-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified untouched BNB and SUI holdout history
        run: |
          python scripts/prepare_indicator_composite_history.py \
            --symbols BNBUSDT,SUIUSDT \
            --lower-timeframe 15m \
            --higher-timeframe 1h \
            --start 2024-08-01 \
            --end 2025-07-31 \
            --output-dir data/indicator_composite_history \
            --manifest research_results/history_manifest.json

      - name: Run unchanged C strategy on older holdout
        env:
          RESEARCH_SYMBOLS: BNBUSDT,SUIUSDT
          RESEARCH_START: 2024-08-01
          RESEARCH_SPLIT: 2025-02-01
          RESEARCH_END: 2025-07-31
        run: python scripts/research_indicator_composite_multisymbol.py

      - name: Upload compact holdout results
        uses: actions/upload-artifact@v4
        with:
          name: indicator-composite-bnb-sui-holdout
          path: |
            research_results/history_manifest.json
            research_results/multisymbol_confirmed_price_action.json
          if-no-files-found: error
          retention-days: 7
