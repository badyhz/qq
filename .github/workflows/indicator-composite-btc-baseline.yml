name: Market Accelerator Activation Research

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/indicator-composite-btc-baseline.yml"
      - "scripts/research_indicator_composite_multisymbol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accelerator-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified 8-symbol 15m and 1h history
        run: |
          python scripts/prepare_indicator_composite_history.py \
            --symbols BTCUSDT,ETHUSDT,BNBUSDT,SUIUSDT,1000PEPEUSDT,XRPUSDT,ARBUSDT,DOGEUSDT \
            --lower-timeframe 15m \
            --higher-timeframe 1h \
            --start 2025-08-01 \
            --end 2026-07-31 \
            --output-dir data/indicator_composite_history \
            --manifest research_results/history_manifest.json

      - name: Run unchanged accelerator activation variants
        run: python scripts/research_indicator_composite_multisymbol.py

      - name: Upload compact accelerator results
        uses: actions/upload-artifact@v4
        with:
          name: market-accelerator-activation-multisymbol
          path: |
            research_results/history_manifest.json
            research_results/market_accelerator_activation_multisymbol.json
          if-no-files-found: error
          retention-days: 7
