name: Market Accelerator FAST-Confirmed Short

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/indicator-composite-btc-baseline.yml"
      - "scripts/research_indicator_composite_multisymbol.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accelerator-fast-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified two-year 15m history only
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          from core.binance_public_ohlcv_archive import download_range_to_csv
          from scripts.prepare_indicator_composite_history import DEFAULT_SYMBOLS

          root = Path("data/indicator_composite_history")
          for symbol in DEFAULT_SYMBOLS:
              result = download_range_to_csv(
                  symbol=symbol,
                  interval="15m",
                  start=date(2024, 8, 1),
                  end=date(2026, 7, 31),
                  output_path=root / symbol / f"{symbol}_15m.csv",
              )
              print(symbol, result["row_count"], result["archive_count"])
          PY

      - name: Run FAST-confirmed short with fee grid
        env:
          RESEARCH_SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SUIUSDT,1000PEPEUSDT,XRPUSDT,ARBUSDT,DOGEUSDT
          RESEARCH_START: 2024-08-01
          RESEARCH_SPLIT: 2025-08-01
          RESEARCH_END: 2026-07-31
        run: python scripts/research_indicator_composite_multisymbol.py

      - name: Upload FAST-confirmed result
        uses: actions/upload-artifact@v4
        with:
          name: market-accelerator-fast-confirmed-short
          path: research_results/market_accelerator_fast_confirmed_short.json
          if-no-files-found: error
          retention-days: 7
