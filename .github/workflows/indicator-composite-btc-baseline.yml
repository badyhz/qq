name: Indicator Composite BTC Baseline

on:
  pull_request:
    branches:
      - agent/indicator-composite-v1
    paths:
      - ".github/workflows/indicator-composite-btc-baseline.yml"
      - "scripts/research_btc_smma_bottom_hypotheses.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  btc-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research merge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified BTCUSDT 15m and 1h history
        run: |
          python scripts/prepare_indicator_composite_history.py \
            --symbols BTCUSDT \
            --lower-timeframe 15m \
            --higher-timeframe 1h \
            --start 2025-08-01 \
            --end 2026-07-31 \
            --output-dir data/indicator_composite_history \
            --manifest research_results/history_manifest.json

      - name: Run zero-friction entry ablation
        run: |
          python scripts/run_indicator_composite_backtest.py \
            --lower-csv data/indicator_composite_history/BTCUSDT/BTCUSDT_15m.csv \
            --higher-csv data/indicator_composite_history/BTCUSDT/BTCUSDT_1h.csv \
            --symbol BTCUSDT \
            --lower-timeframe 15m \
            --higher-timeframe 1h \
            --fee-pct 0 \
            --slippage-pct 0 \
            --output research_results/btc_zero_friction.json

      - name: Run conservative research-friction entry ablation
        run: |
          python scripts/run_indicator_composite_backtest.py \
            --lower-csv data/indicator_composite_history/BTCUSDT/BTCUSDT_15m.csv \
            --higher-csv data/indicator_composite_history/BTCUSDT/BTCUSDT_1h.csv \
            --symbol BTCUSDT \
            --lower-timeframe 15m \
            --higher-timeframe 1h \
            --fee-pct 0.001 \
            --slippage-pct 0.0005 \
            --output research_results/btc_research_friction.json

      - name: Run positive-direction accelerator and R-target grid
        run: |
          python - <<'PY'
          import json
          from dataclasses import replace
          from pathlib import Path

          from core.indicator_composite_backtest import (
              CompositeBacktestConfig,
              run_indicator_composite_ablation,
          )
          from core.offline_backtest_trade_simulator import TradeSimulationParams
          from core.paper_trading.higher_timeframe_trend import align_higher_timeframe_trends
          from core.paper_trading.indicator_composite_adapter import (
              build_recovered_v0_composite_states,
          )
          from core.paper_trading.indicator_composite_strategy import (
              AccelerationRegime,
              IndicatorCompositeConfig,
          )
          from core.paper_trading.market_accelerator_port import calculate_market_accelerator
          from scripts.run_indicator_composite_backtest import _load_historical, _market_bars

          lower_path = Path("data/indicator_composite_history/BTCUSDT/BTCUSDT_15m.csv")
          higher_path = Path("data/indicator_composite_history/BTCUSDT/BTCUSDT_1h.csv")
          lower_hist = _load_historical(lower_path, "BTCUSDT", "15m", 500)
          higher_hist = _load_historical(higher_path, "BTCUSDT", "1h", 500)
          trends = align_higher_timeframe_trends(lower_hist, higher_hist)
          bars = _market_bars(lower_hist)
          base_states = build_recovered_v0_composite_states(bars, trends)
          accelerator = calculate_market_accelerator(bars)

          positive_states = []
          for state, point in zip(base_states, accelerator.points):
              if point.signed_speed is None or point.signed_speed <= 0:
                  state = replace(state, acceleration_regime=AccelerationRegime.IDLE)
              positive_states.append(state)

          output = {
              "symbol": "BTCUSDT",
              "period": "2025-08-01..2026-07-31",
              "friction": "zero",
              "accelerator_policy": "positive_signed_speed_only",
              "rows": [],
          }
          for target_r in (1.5, 2.0, 2.5, 3.0):
              config = CompositeBacktestConfig(
                  simulation=TradeSimulationParams(
                      slippage_pct=0.0,
                      fee_pct=0.0,
                      max_hold_bars=100,
                  ),
                  strategy=IndicatorCompositeConfig(
                      initial_take_profit_r=target_r,
                  ),
              )
              ablation = run_indicator_composite_ablation(
                  bars,
                  tuple(positive_states),
                  config,
              )
              row = {"target_r": target_r, "variants": {}}
              for entry in ablation["variants"]:
                  result = entry["result"]
                  metrics = result["metrics"]
                  row["variants"][entry["variant"]] = {
                      "signals": result["signal_count"],
                      "trades": result["trade_count"],
                      "win_rate": metrics["win_rate"],
                      "expectancy_r": metrics["expectancy_r"],
                      "profit_factor": metrics["profit_factor"],
                      "max_drawdown_r": metrics["max_drawdown_r"],
                      "avg_mfe_r": metrics["avg_mfe_r"],
                      "avg_mae_r": metrics["avg_mae_r"],
                  }
              output["rows"].append(row)

          Path("research_results/btc_positive_direction_r_grid.json").write_text(
              json.dumps(output, indent=2), encoding="utf-8"
          )
          for row in output["rows"]:
              print(f"=== POSITIVE_DIRECTION target={row['target_r']}R ===")
              for name, values in row["variants"].items():
                  print(name, values)
          PY

      - name: Run temporary recovered-SMMA Bottom hypotheses
        run: python scripts/research_btc_smma_bottom_hypotheses.py

      - name: Print compact baseline summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("research_results/btc_zero_friction.json"),
              Path("research_results/btc_research_friction.json"),
          ):
              data = json.loads(path.read_text())
              print(f"=== {path.name} ===")
              print(
                  "bars",
                  data["lower_bar_count"],
                  data["higher_bar_count"],
                  "formula",
                  data["research_formula_version"],
              )
              for entry in data["entry_ablation"]["variants"]:
                  result = entry["result"]
                  metrics = result["metrics"]
                  print(
                      entry["variant"],
                      "signals=", result["signal_count"],
                      "trades=", result["trade_count"],
                      "win_rate=", metrics["win_rate"],
                      "expectancy_r=", metrics["expectancy_r"],
                      "pf=", metrics["profit_factor"],
                      "max_dd_r=", metrics["max_drawdown_r"],
                      "risk_blocked=", result["blocked_risk_gate"],
                  )
          PY

      - name: Upload compact research results
        uses: actions/upload-artifact@v4
        with:
          name: indicator-composite-btc-baseline
          path: |
            research_results/history_manifest.json
            research_results/btc_zero_friction.json
            research_results/btc_research_friction.json
            research_results/btc_positive_direction_r_grid.json
            research_results/btc_smma_bottom_hypotheses.json
          if-no-files-found: error
          retention-days: 7
