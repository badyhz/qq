name: ZEC Admin Focused Check

on:
  push:
    branches:
      - feature/zec-4h-admin-v1

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile admin modules
        run: python -m py_compile core/zec_4h_admin.py scripts/run_zec_4h_admin.py
      - name: Run focused ZEC tests
        run: python -m pytest tests/unit/test_zec_4h_admin.py tests/unit/test_zec_4h_small_live.py -q
